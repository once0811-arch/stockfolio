services:
  postgres:
    image: postgres:16-alpine
    container_name: portfolio_ops_postgres
    environment:
      POSTGRES_DB: portfolio_ops
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - portfolio_ops_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d portfolio_ops"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

volumes:
  portfolio_ops_pgdata:
